<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 Fantasy Draft Wheel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Bebas+Neue&family=Source+Sans+3:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    overflow-x: hidden;
  }

  :root {
    --gold: #D4AF37;
    --dark: #0a0e1a;
    --darker: #060911;
    --accent-red: #E4002B;
    --accent-blue: #003DA5;
  }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--dark);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .watermark-logo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    opacity: 0.2;
    z-index: 1;
    pointer-events: none;
  }

  .watermark-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 50%, rgba(0,61,165,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 50%, rgba(228,0,43,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.08) 0%, transparent 40%);
    z-index: 0;
    pointer-events: none;
  }

  .header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 16px 20px 4px;
  }

  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(22px, 3.5vw, 44px);
    letter-spacing: 6px;
    background: linear-gradient(135deg, var(--gold), #f5e6a3, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }

  .header .subtitle {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(9px, 1.2vw, 12px);
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-top: 2px;
  }

  /* --- MAIN 3-COLUMN + SIDEBAR LAYOUT --- */
  .arena {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 10px 12px 30px;
    gap: 0;
    max-width: 100vw;
    overflow-x: hidden;
  }

  /* Wheel columns */
  .wheel-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 1;
    min-width: 0;
  }

  .wheel-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 4px;
    text-align: center;
  }

  .wheel-label strong {
    color: var(--gold);
    font-size: 13px;
  }

  .wheel-wrapper {
    position: relative;
    width: min(28vw, 480px);
    height: min(28vw, 480px);
  }

  canvas.wheel-canvas {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 30px rgba(212,175,55,0.12));
    transition: filter 0.3s;
  }

  canvas.wheel-canvas.spinning {
    filter: drop-shadow(0 0 50px rgba(212,175,55,0.3));
  }

  .pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 26px solid var(--gold);
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    transition: transform 0.08s;
  }

  .pointer.tick { transform: translateX(-50%) scaleY(0.85); }

  .center-hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 50px; height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a1f30 0%, var(--darker) 100%);
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    box-shadow: 0 0 14px rgba(0,0,0,0.6), inset 0 0 8px rgba(212,175,55,0.12);
  }

  .center-hub span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--gold);
  }

  /* Player input below player wheel */
  .player-input-area {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
    max-width: 300px;
  }

  .input-row {
    display: flex;
    gap: 6px;
    width: 100%;
  }

  .player-input {
    flex: 1;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 8px 14px;
    border-radius: 24px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff;
    outline: none;
    transition: border-color 0.2s;
  }

  .player-input:focus { border-color: var(--gold); }
  .player-input::placeholder { color: rgba(255,255,255,0.25); }

  .add-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dark);
    background: linear-gradient(135deg, var(--gold), #f5e6a3);
    border: none;
    padding: 8px 16px;
    border-radius: 24px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .add-btn:hover { transform: translateY(-1px); }
  .add-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .player-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    max-width: 300px;
  }

  .import-row {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .import-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.04);
    border: 1px dashed rgba(255,255,255,0.15);
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .import-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(212,175,55,0.06);
  }

  .player-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(212,175,55,0.1);
    border: 1px solid rgba(212,175,55,0.25);
    color: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.3s;
  }

  .player-tag.eliminated {
    background: rgba(255,255,255,0.03);
    border-color: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.2);
    text-decoration: line-through;
    opacity: 0.5;
  }

  .player-tag .remove-x {
    cursor: pointer;
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    line-height: 1;
    transition: color 0.2s;
  }

  .player-tag .remove-x:hover { color: var(--accent-red); }
  .player-tag.eliminated .remove-x { display: none; }

  /* --- CENTER COLUMN (between wheels) --- */
  .center-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    min-width: 200px;
    align-self: flex-start;
    padding-top: clamp(80px, 12vw, 160px);
    gap: 14px;
    flex-shrink: 0;
  }

  .spin-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--dark);
    background: linear-gradient(135deg, var(--gold), #f5e6a3, var(--gold));
    border: none;
    padding: 14px 40px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 25px rgba(212,175,55,0.3);
    position: relative;
    overflow: hidden;
    white-space: nowrap;
  }

  .spin-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s;
  }

  .spin-btn:hover::after { transform: translateX(100%); }
  .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 35px rgba(212,175,55,0.45); }
  .spin-btn:active { transform: translateY(0); }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .reset-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.15);
    padding: 8px 22px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .reset-btn:hover { border-color: var(--accent-red); color: var(--accent-red); background: rgba(228,0,43,0.08); }
  .reset-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

  /* Pairing card */
  .pairing-result {
    text-align: center;
    min-height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .pairing-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: 14px;
    padding: 12px 18px;
    animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .pairing-card .side { text-align: center; }

  .pairing-card .side-emoji {
    font-size: 28px;
    display: block;
    margin-bottom: 1px;
  }

  .pairing-card .side-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #fff, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }

  .pairing-card .side-sub {
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  .pairing-card .connector {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--gold);
    opacity: 0.5;
  }

  .pick-label {
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 6px;
  }

  .all-done {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes resultPop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* --- DRAFT RESULTS SIDEBAR --- */
  .draft-sidebar {
    flex-shrink: 0;
    width: 220px;
    max-height: clamp(300px, 60vh, 500px);
    display: flex;
    flex-direction: column;
    margin-left: 14px;
    align-self: flex-start;
    margin-top: 22px;
  }

  .draft-sidebar-title {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 8px;
    text-align: center;
    flex-shrink: 0;
  }

  .draft-sidebar-empty {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.12);
    text-align: center;
    padding: 20px 0;
    text-transform: uppercase;
  }

  .download-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(212,175,55,0.08);
    border: 1px solid rgba(212,175,55,0.25);
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    margin-bottom: 8px;
    flex-shrink: 0;
  }

  .download-btn:hover {
    background: rgba(212,175,55,0.18);
    border-color: var(--gold);
  }

  .download-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
    pointer-events: none;
  }

  .draft-list {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-right: 4px;
  }

  .draft-list::-webkit-scrollbar { width: 4px; }
  .draft-list::-webkit-scrollbar-track { background: transparent; }
  .draft-list::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.2); border-radius: 4px; }

  .draft-row {
    display: grid;
    grid-template-columns: 26px 1fr 16px 1fr;
    gap: 4px;
    align-items: center;
    animation: chipIn 0.3s ease;
  }

  .dr-num {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    color: var(--gold);
    text-align: right;
    font-weight: 600;
  }

  .dr-team, .dr-player {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 4px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dr-arrow {
    font-size: 9px;
    color: rgba(212,175,55,0.35);
    text-align: center;
  }

  @keyframes chipIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  #confetti {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
  }

  /* --- RESPONSIVE --- */

  /* Large tablets / small laptops */
  @media (max-width: 1200px) {
    .draft-sidebar { width: 180px; }
    .wheel-wrapper {
      width: clamp(220px, 28vw, 400px);
      height: clamp(220px, 28vw, 400px);
    }
    .center-col {
      padding: 0 10px;
      min-width: 160px;
      padding-top: clamp(60px, 10vw, 140px);
    }
  }

  /* iPad landscape / tablets ~1024px */
  @media (max-width: 1024px) {
    .arena {
      flex-wrap: wrap;
      justify-content: center;
      padding: 8px 16px 24px;
    }

    .wheel-wrapper {
      width: clamp(200px, 30vw, 360px);
      height: clamp(200px, 30vw, 360px);
    }

    .center-col {
      min-width: 140px;
      padding: 0 8px;
      padding-top: clamp(50px, 8vw, 120px);
    }

    .draft-sidebar {
      width: 160px;
      margin-top: 22px;
    }
  }

  /* iPad portrait / small tablets */
  @media (max-width: 860px) {
    .header { padding: 14px 16px 4px; }
    .header h1 { letter-spacing: 4px; }

    .arena {
      flex-direction: column;
      align-items: center;
      padding: 8px 16px 24px;
      gap: 0;
    }

    .wheel-col {
      width: 100%;
      order: initial;
    }

    .wheel-col:first-child { order: 1; }

    .center-col {
      order: 2;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      padding: 12px 0;
      padding-top: 12px;
      gap: 10px;
      min-width: unset;
      align-self: center;
    }

    .center-col .pairing-result { width: 100%; }

    .wheel-col:nth-child(3) { order: 3; }

    .wheel-wrapper {
      width: min(65vw, 380px);
      height: min(65vw, 380px);
      margin: 0 auto;
    }

    .draft-sidebar {
      order: 4;
      width: 100%;
      max-height: none;
      margin-left: 0;
      margin-top: 12px;
      max-width: 500px;
    }

    .player-input-area { max-width: 400px; }
    .player-list { max-width: 400px; }

    .spin-btn {
      font-size: 16px;
      padding: 12px 36px;
    }
  }

  /* Large phones */
  @media (max-width: 560px) {
    .header { padding: 10px 12px 2px; }
    .header h1 {
      font-size: 24px;
      letter-spacing: 3px;
    }
    .header .subtitle {
      font-size: 8px;
      letter-spacing: 5px;
    }

    .arena { padding: 6px 8px 20px; }

    .wheel-wrapper {
      width: min(88vw, 340px);
      height: min(88vw, 340px);
    }

    .wheel-label {
      font-size: 10px;
      letter-spacing: 3px;
    }

    .center-col {
      padding: 10px 0;
      gap: 8px;
    }

    .spin-btn {
      font-size: 16px;
      padding: 14px 44px;
      letter-spacing: 3px;
      width: auto;
      min-width: 180px;
      -webkit-tap-highlight-color: transparent;
    }

    .reset-btn {
      font-size: 12px;
      padding: 10px 22px;
      -webkit-tap-highlight-color: transparent;
    }

    .pairing-card {
      padding: 10px 14px;
      gap: 10px;
    }

    .pairing-card .side-emoji { font-size: 24px; }
    .pairing-card .side-name { font-size: 18px; }
    .pairing-card .connector { font-size: 18px; }

    .player-input-area {
      max-width: 100%;
      padding: 0 8px;
    }

    .player-input {
      font-size: 16px;
      padding: 12px 16px;
      -webkit-appearance: none;
    }

    .add-btn {
      font-size: 13px;
      padding: 12px 20px;
      -webkit-tap-highlight-color: transparent;
    }

    .player-list {
      max-width: 100%;
      padding: 0 4px;
    }

    .player-tag {
      font-size: 11px;
      padding: 4px 10px;
    }

    .player-tag .remove-x {
      font-size: 14px;
      padding: 2px;
    }

    .draft-sidebar {
      margin-top: 14px;
      max-width: 100%;
      padding: 0 8px;
    }

    .draft-sidebar-title { font-size: 10px; }

    .download-btn {
      font-size: 12px;
      padding: 10px 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .import-btn {
      padding: 10px 16px;
      font-size: 12px;
    }

    .draft-row { gap: 3px 6px; }
    .dr-num { font-size: 10px; }
    .dr-team, .dr-player {
      font-size: 10px;
      padding: 4px 6px;
    }

    .pointer {
      border-left-width: 10px;
      border-right-width: 10px;
      border-top-width: 22px;
      top: -10px;
    }

    .center-hub {
      width: 40px; height: 40px;
    }

    .center-hub span { font-size: 8px; }
  }

  /* Small phones */
  @media (max-width: 380px) {
    .wheel-wrapper {
      width: 90vw;
      height: 90vw;
    }

    .header h1 {
      font-size: 20px;
      letter-spacing: 2px;
    }

    .spin-btn {
      font-size: 14px;
      padding: 12px 32px;
    }

    .pairing-card .side-name { font-size: 16px; }
  }

  /* iPad specific: both orientations */
  @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
    .arena {
      flex-direction: column;
      align-items: center;
    }

    .wheel-col { width: 100%; }

    .wheel-wrapper {
      width: min(55vw, 380px);
      height: min(55vw, 380px);
      margin: 0 auto;
    }

    .center-col {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      padding: 14px 0;
      padding-top: 14px;
      min-width: unset;
      gap: 12px;
    }

    .center-col .pairing-result { width: 100%; }

    .draft-sidebar {
      width: 100%;
      max-width: 500px;
      margin-left: 0;
      margin-top: 14px;
      max-height: none;
    }

    .player-input-area { max-width: 420px; }
    .player-list { max-width: 420px; }

    .spin-btn {
      font-size: 18px;
      padding: 14px 48px;
    }
  }

  /* Touch device optimizations */
  @media (hover: none) and (pointer: coarse) {
    .spin-btn:hover { transform: none; box-shadow: 0 4px 25px rgba(212,175,55,0.3); }
    .spin-btn:active { transform: scale(0.97); }
    .reset-btn:hover { border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.55); background: transparent; }
    .reset-btn:active { border-color: var(--accent-red); color: var(--accent-red); }
    .add-btn:hover { transform: none; }
    .add-btn:active { transform: scale(0.97); }
    .download-btn:hover { background: rgba(212,175,55,0.08); }
    .download-btn:active { background: rgba(212,175,55,0.2); }
    .import-btn:hover { border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.04); }
    .import-btn:active { border-color: var(--gold); color: var(--gold); }
    .player-tag .remove-x { font-size: 16px; padding: 4px; }
  }

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// Convert 2-letter country code to flag emoji at runtime (avoids hidden Unicode in source)
function codeToFlag(code) {
  if (code === 'GB-ENG') return String.fromCodePoint(0x1F3F4,0xE0067,0xE0062,0xE0065,0xE006E,0xE0067,0xE007F);
  if (code === 'GB-SCT') return String.fromCodePoint(0x1F3F4,0xE0067,0xE0062,0xE0073,0xE0063,0xE0074,0xE007F);
  return [...code.toUpperCase()].map(c => String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65)).join('');
}

const ALL_TEAMS = [
  { name: "England", cc: "GB-ENG", conf: "UEFA" },
  { name: "France", cc: "FR", conf: "UEFA" },
  { name: "Spain", cc: "ES", conf: "UEFA" },
  { name: "Germany", cc: "DE", conf: "UEFA" },
  { name: "Portugal", cc: "PT", conf: "UEFA" },
  { name: "Netherlands", cc: "NL", conf: "UEFA" },
  { name: "Belgium", cc: "BE", conf: "UEFA" },
  { name: "Croatia", cc: "HR", conf: "UEFA" },
  { name: "Switzerland", cc: "CH", conf: "UEFA" },
  { name: "Austria", cc: "AT", conf: "UEFA" },
  { name: "Norway", cc: "NO", conf: "UEFA" },
  { name: "Scotland", cc: "GB-SCT", conf: "UEFA" },
  { name: "Sweden", cc: "SE", conf: "UEFA" },
  { name: "T\u00FCrkiye", cc: "TR", conf: "UEFA" },
  { name: "Bosnia & Herz.", cc: "BA", conf: "UEFA" },
  { name: "Czechia", cc: "CZ", conf: "UEFA" },
  { name: "Argentina", cc: "AR", conf: "CONMEBOL" },
  { name: "Brazil", cc: "BR", conf: "CONMEBOL" },
  { name: "Uruguay", cc: "UY", conf: "CONMEBOL" },
  { name: "Colombia", cc: "CO", conf: "CONMEBOL" },
  { name: "Ecuador", cc: "EC", conf: "CONMEBOL" },
  { name: "Paraguay", cc: "PY", conf: "CONMEBOL" },
  { name: "USA", cc: "US", conf: "CONCACAF" },
  { name: "Mexico", cc: "MX", conf: "CONCACAF" },
  { name: "Canada", cc: "CA", conf: "CONCACAF" },
  { name: "Panama", cc: "PA", conf: "CONCACAF" },
  { name: "Haiti", cc: "HT", conf: "CONCACAF" },
  { name: "Cura\u00E7ao", cc: "CW", conf: "CONCACAF" },
  { name: "Morocco", cc: "MA", conf: "CAF" },
  { name: "Senegal", cc: "SN", conf: "CAF" },
  { name: "C\u00F4te d'Ivoire", cc: "CI", conf: "CAF" },
  { name: "Egypt", cc: "EG", conf: "CAF" },
  { name: "Algeria", cc: "DZ", conf: "CAF" },
  { name: "Ghana", cc: "GH", conf: "CAF" },
  { name: "South Africa", cc: "ZA", conf: "CAF" },
  { name: "Tunisia", cc: "TN", conf: "CAF" },
  { name: "Cabo Verde", cc: "CV", conf: "CAF" },
  { name: "DR Congo", cc: "CD", conf: "CAF" },
  { name: "Japan", cc: "JP", conf: "AFC" },
  { name: "Australia", cc: "AU", conf: "AFC" },
  { name: "South Korea", cc: "KR", conf: "AFC" },
  { name: "Iran", cc: "IR", conf: "AFC" },
  { name: "Saudi Arabia", cc: "SA", conf: "AFC" },
  { name: "Qatar", cc: "QA", conf: "AFC" },
  { name: "Jordan", cc: "JO", conf: "AFC" },
  { name: "Uzbekistan", cc: "UZ", conf: "AFC" },
  { name: "Iraq", cc: "IQ", conf: "AFC" },
  { name: "New Zealand", cc: "NZ", conf: "OFC" },
].map(t => ({ ...t, flag: codeToFlag(t.cc) }));

const CONF_COLORS = {
  UEFA:     ["#003DA5", "#1a5cc8"],
  CONMEBOL: ["#1B6B3A", "#28944f"],
  CONCACAF: ["#B8292F", "#d44045"],
  CAF:      ["#C26B17", "#da8a2e"],
  AFC:      ["#6B2D8B", "#8c44ad"],
  OFC:      ["#0E7C7B", "#12a19f"],
};

const PLAYER_COLORS = [
  ["#8B5CF6","#a78bfa"], ["#2563EB","#60a5fa"], ["#0891B2","#22d3ee"],
  ["#059669","#34d399"], ["#D97706","#fbbf24"], ["#DC2626","#f87171"],
  ["#DB2777","#f472b6"], ["#7C3AED","#a78bfa"], ["#0D9488","#2dd4bf"],
  ["#EA580C","#fb923c"], ["#4F46E5","#818cf8"], ["#B91C1C","#fca5a5"],
];

let allPlayers = [];
let eliminatedTeams = new Set();
let eliminatedPlayers = new Set();
let draftHistory = [];
let spinning = false;

let teamAngle = 0, playerAngle = 0;
let teamVel = 0, playerVel = 0;
let teamDone = false, playerDone = false;
let teamResult = null, playerResult = null;
let lastTeamSeg = -1, lastPlayerSeg = -1;

const DPR = window.devicePixelRatio || 1;

const teamCanvas = document.getElementById('teamWheel');
const teamCtx = teamCanvas.getContext('2d');
const playerCanvas = document.getElementById('playerWheel');
const playerCtx = playerCanvas.getContext('2d');

let tCX, tCY, tR, pCX, pCY, pR;

function resizeCanvases() {
  const tRect = teamCanvas.getBoundingClientRect();
  teamCanvas.width = tRect.width * DPR;
  teamCanvas.height = tRect.width * DPR;
  tCX = teamCanvas.width / 2; tCY = teamCanvas.height / 2;
  tR = tCX - 6 * DPR;

  const pRect = playerCanvas.getBoundingClientRect();
  playerCanvas.width = pRect.width * DPR;
  playerCanvas.height = pRect.width * DPR;
  pCX = playerCanvas.width / 2; pCY = playerCanvas.height / 2;
  pR = pCX - 6 * DPR;

  drawTeamWheel();
  drawPlayerWheel();
}

function getActiveTeams() { return ALL_TEAMS.filter(t => !eliminatedTeams.has(t.name)); }
function getActivePlayers() { return allPlayers.filter(p => !eliminatedPlayers.has(p)); }

function drawTeamWheel() {
  teamCtx.clearRect(0, 0, teamCanvas.width, teamCanvas.height);
  const teams = getActiveTeams();
  const N = teams.length;
  if (N === 0) { drawEmptyWheel(teamCtx, tCX, tCY, tR, 'No teams left'); return; }
  const ARC = (2 * Math.PI) / N;

  teamCtx.beginPath();
  teamCtx.arc(tCX, tCY, tR + 3 * DPR, 0, Math.PI * 2);
  teamCtx.strokeStyle = 'rgba(212,175,55,0.35)';
  teamCtx.lineWidth = 2 * DPR;
  teamCtx.stroke();

  for (let i = 0; i < N; i++) {
    const sa = teamAngle + i * ARC - Math.PI / 2;
    const t = teams[i];
    const c = CONF_COLORS[t.conf];

    teamCtx.beginPath();
    teamCtx.moveTo(tCX, tCY);
    teamCtx.arc(tCX, tCY, tR, sa, sa + ARC);
    teamCtx.closePath();
    teamCtx.fillStyle = i % 2 === 0 ? c[0] : c[1];
    teamCtx.fill();
    teamCtx.strokeStyle = 'rgba(0,0,0,0.25)';
    teamCtx.lineWidth = 1 * DPR;
    teamCtx.stroke();

    const fs = N <= 8 ? 16 : N <= 16 ? 14 : N <= 28 ? 12 : 10;
    const ns = N <= 8 ? 14 : N <= 16 ? 12 : N <= 28 ? 10 : 8;

    teamCtx.save();
    teamCtx.translate(tCX, tCY);
    teamCtx.rotate(sa + ARC / 2);
    teamCtx.textAlign = 'right';
    teamCtx.fillStyle = '#fff';
    teamCtx.shadowColor = 'rgba(0,0,0,0.5)';
    teamCtx.shadowBlur = 3 * DPR;
    teamCtx.font = `${fs * DPR}px sans-serif`;
    teamCtx.fillText(t.flag, tR - 6 * DPR, 4 * DPR);
    teamCtx.font = `600 ${ns * DPR}px 'Oswald', sans-serif`;
    teamCtx.fillText(t.name, tR - 22 * DPR, 4 * DPR);
    teamCtx.restore();
  }

  drawInnerHub(teamCtx, tCX, tCY);
  drawTicks(teamCtx, tCX, tCY, tR, N, teamAngle);
}

function drawPlayerWheel() {
  playerCtx.clearRect(0, 0, playerCanvas.width, playerCanvas.height);
  const players = getActivePlayers();
  const N = players.length;
  if (N === 0) {
    drawEmptyWheel(playerCtx, pCX, pCY, pR, allPlayers.length === 0 ? 'Add players below' : 'No players left');
    return;
  }
  const ARC = (2 * Math.PI) / N;

  playerCtx.beginPath();
  playerCtx.arc(pCX, pCY, pR + 3 * DPR, 0, Math.PI * 2);
  playerCtx.strokeStyle = 'rgba(212,175,55,0.35)';
  playerCtx.lineWidth = 2 * DPR;
  playerCtx.stroke();

  for (let i = 0; i < N; i++) {
    const sa = playerAngle + i * ARC - Math.PI / 2;
    const ci = i % PLAYER_COLORS.length;

    playerCtx.beginPath();
    playerCtx.moveTo(pCX, pCY);
    playerCtx.arc(pCX, pCY, pR, sa, sa + ARC);
    playerCtx.closePath();
    playerCtx.fillStyle = i % 2 === 0 ? PLAYER_COLORS[ci][0] : PLAYER_COLORS[ci][1];
    playerCtx.fill();
    playerCtx.strokeStyle = 'rgba(0,0,0,0.25)';
    playerCtx.lineWidth = 1 * DPR;
    playerCtx.stroke();

    const ns = N <= 6 ? 15 : N <= 12 ? 13 : N <= 20 ? 11 : 9;

    playerCtx.save();
    playerCtx.translate(pCX, pCY);
    playerCtx.rotate(sa + ARC / 2);
    playerCtx.textAlign = 'right';
    playerCtx.fillStyle = '#fff';
    playerCtx.shadowColor = 'rgba(0,0,0,0.5)';
    playerCtx.shadowBlur = 3 * DPR;
    playerCtx.font = `600 ${ns * DPR}px 'Oswald', sans-serif`;
    playerCtx.fillText(players[i], pR - 12 * DPR, 4 * DPR);
    playerCtx.restore();
  }

  drawInnerHub(playerCtx, pCX, pCY);
  drawTicks(playerCtx, pCX, pCY, pR, N, playerAngle);
}

function drawEmptyWheel(c, cx, cy, r, msg) {
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,255,255,0.03)';
  c.fill();
  c.strokeStyle = 'rgba(212,175,55,0.15)';
  c.lineWidth = 2 * DPR;
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.15)';
  c.font = `600 ${11 * DPR}px 'Oswald', sans-serif`;
  c.textAlign = 'center';
  c.fillText(msg, cx, cy + 4 * DPR);
  drawInnerHub(c, cx, cy);
}

function drawInnerHub(c, cx, cy) {
  c.beginPath();
  c.arc(cx, cy, 24 * DPR, 0, Math.PI * 2);
  c.fillStyle = 'rgba(10,14,26,0.9)';
  c.fill();
  c.strokeStyle = '#D4AF37';
  c.lineWidth = 2 * DPR;
  c.stroke();
}

function drawTicks(c, cx, cy, r, n, ang) {
  const ARC = (2 * Math.PI) / n;
  for (let i = 0; i < n; i++) {
    const a = ang + i * ARC - Math.PI / 2;
    c.beginPath();
    c.moveTo(cx + Math.cos(a) * (r - 2 * DPR), cy + Math.sin(a) * (r - 2 * DPR));
    c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    c.strokeStyle = 'rgba(212,175,55,0.4)';
    c.lineWidth = 1.5 * DPR;
    c.stroke();
  }
}

// --- PLAYER MANAGEMENT ---
function addPlayer() {
  const input = document.getElementById('playerInput');
  const name = input.value.trim();
  if (!name) return;
  if (allPlayers.some(p => p.toLowerCase() === name.toLowerCase() && !eliminatedPlayers.has(p))) {
    input.value = ''; return;
  }
  allPlayers.push(name);
  input.value = '';
  input.focus();
  playerAngle = 0;
  drawPlayerWheel();
  renderPlayerList();
  updateUI();
}

function removePlayer(name) {
  if (spinning || eliminatedPlayers.has(name)) return;
  allPlayers = allPlayers.filter(p => p !== name);
  playerAngle = 0;
  drawPlayerWheel();
  renderPlayerList();
  updateUI();
}

function importPlayers(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  const isCSV = file.name.toLowerCase().endsWith('.csv');

  if (isCSV) {
    reader.onload = function(e) {
      const text = e.target.result;
      const lines = text.split(/\r?\n/);
      let added = 0;
      lines.forEach(line => {
        // Handle CSV with possible quotes
        let name = line.replace(/^["']|["']$/g, '').trim();
        // Skip header row
        if (!name || name.toLowerCase() === 'players' || name.toLowerCase() === 'player') return;
        // Skip duplicates
        if (allPlayers.some(p => p.toLowerCase() === name.toLowerCase() && !eliminatedPlayers.has(p))) return;
        allPlayers.push(name);
        added++;
      });
      if (added > 0) {
        playerAngle = 0;
        drawPlayerWheel();
        renderPlayerList();
        updateUI();
      }
      input.value = '';
    };
    reader.readAsText(file);
  } else {
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        let added = 0;
        rows.forEach(row => {
          if (!row || !row[0]) return;
          const name = String(row[0]).trim();
          // Skip header
          if (name.toLowerCase() === 'players' || name.toLowerCase() === 'player') return;
          // Skip duplicates
          if (allPlayers.some(p => p.toLowerCase() === name.toLowerCase() && !eliminatedPlayers.has(p))) return;
          allPlayers.push(name);
          added++;
        });
        if (added > 0) {
          playerAngle = 0;
          drawPlayerWheel();
          renderPlayerList();
          updateUI();
        }
      } catch (err) {
        alert('Could not read file. Please use an .xlsx, .xls, or .csv file with a "Players" column.');
      }
      input.value = '';
    };
    reader.readAsArrayBuffer(file);
  }
}

function renderPlayerList() {
  const el = document.getElementById('playerList');
  el.innerHTML = allPlayers.map(p => {
    const isOut = eliminatedPlayers.has(p);
    const cls = isOut ? 'player-tag eliminated' : 'player-tag';
    const x = isOut ? '' : `<span class="remove-x" onclick="removePlayer('${p.replace(/'/g, "\\'")}')">&#x2715;</span>`;
    return `<span class="${cls}">${p}${x}</span>`;
  }).join('');
}

document.getElementById('playerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addPlayer();
});

// --- SPIN BOTH ---
function spinBoth() {
  if (spinning) return;
  const at = getActiveTeams(), ap = getActivePlayers();
  if (at.length === 0 || ap.length === 0) return;

  spinning = true;
  teamDone = false; playerDone = false;
  teamResult = null; playerResult = null;

  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resetBtn').disabled = true;
  document.getElementById('addBtn').disabled = true;
  document.getElementById('pairingResult').innerHTML = '';
  teamCanvas.classList.add('spinning');
  playerCanvas.classList.add('spinning');

  // Team: ~2 seconds
  teamVel = (Math.random() * 1.5 + 2) * Math.PI * 2 / 60;
  // Player: ~2.5 seconds
  playerVel = (Math.random() * 1.5 + 2.2) * Math.PI * 2 / 60;

  requestAnimationFrame(animateDual);
}

function animateDual() {
  if (!teamDone) {
    teamAngle += teamVel;
    teamVel *= 0.955;
    const at = getActiveTeams();
    const tARC = (2 * Math.PI) / at.length;
    const tNorm = (((-teamAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2));
    const tSeg = Math.floor(tNorm / tARC);
    if (tSeg !== lastTeamSeg) {
      lastTeamSeg = tSeg;
      document.getElementById('teamPointer').classList.add('tick');
      setTimeout(() => document.getElementById('teamPointer').classList.remove('tick'), 60);
    }
    drawTeamWheel();
    if (teamVel < 0.001) {
      teamVel = 0; teamDone = true;
      teamCanvas.classList.remove('spinning');
      teamResult = at[Math.floor(tNorm / tARC) % at.length];
    }
  }

  if (!playerDone) {
    playerAngle += playerVel;
    playerVel *= 0.958;
    const ap = getActivePlayers();
    const pARC = (2 * Math.PI) / ap.length;
    const pNorm = (((-playerAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2));
    const pSeg = Math.floor(pNorm / pARC);
    if (pSeg !== lastPlayerSeg) {
      lastPlayerSeg = pSeg;
      document.getElementById('playerPointer').classList.add('tick');
      setTimeout(() => document.getElementById('playerPointer').classList.remove('tick'), 60);
    }
    drawPlayerWheel();
    if (playerVel < 0.001) {
      playerVel = 0; playerDone = true;
      playerCanvas.classList.remove('spinning');
      playerResult = ap[Math.floor(pNorm / pARC) % ap.length];
    }
  }

  if (!teamDone || !playerDone) requestAnimationFrame(animateDual);
  else finalizePairing();
}

function finalizePairing() {
  spinning = false;
  const pickNum = draftHistory.length + 1;
  draftHistory.push({ team: teamResult, player: playerResult });

  eliminatedTeams.add(teamResult.name);
  eliminatedPlayers.add(playerResult);

  document.getElementById('pairingResult').innerHTML = `
    <div class="pick-label">Pick #${pickNum}</div>
    <div class="pairing-card">
      <div class="side">
        <span class="side-emoji">${teamResult.flag}</span>
        <span class="side-name">${teamResult.name}</span>
        <span class="side-sub">${teamResult.conf}</span>
      </div>
      <span class="connector">&#xD7;</span>
      <div class="side">
        <span class="side-emoji">&#x1F3AE;</span>
        <span class="side-name">${playerResult}</span>
        <span class="side-sub">Player</span>
      </div>
    </div>
  `;

  launchConfetti();

  setTimeout(() => {
    teamAngle = 0; playerAngle = 0;
    drawTeamWheel();
    drawPlayerWheel();
    renderPlayerList();
    updateUI();
    updateDraftSidebar();
  }, 700);
}

function updateUI() {
  const at = getActiveTeams().length, ap = getActivePlayers().length;
  document.getElementById('teamCount').textContent = at;
  document.getElementById('playerCount').textContent = ap;
  document.getElementById('spinBtn').disabled = !(at > 0 && ap > 0 && !spinning);
  document.getElementById('resetBtn').disabled = draftHistory.length === 0;
  document.getElementById('addBtn').disabled = spinning;

  if (draftHistory.length > 0 && (at === 0 || ap === 0)) {
    const msg = at === 0 && ap === 0
      ? '&#x1F3C6; Draft complete!'
      : ap === 0 ? '&#x1F3C6; All players assigned!'
      : '&#x1F3C6; All teams drafted!';
    document.getElementById('pairingResult').innerHTML = `<div class="all-done">${msg}</div>`;
  }
}

function updateDraftSidebar() {
  const el = document.getElementById('draftList');
  document.getElementById('downloadBtn').disabled = draftHistory.length === 0;
  if (draftHistory.length === 0) {
    el.innerHTML = '<div class="draft-sidebar-empty">No picks yet</div>';
    return;
  }
  el.innerHTML = draftHistory.map((d, i) => `
    <div class="draft-row">
      <span class="dr-num">#${i + 1}</span>
      <span class="dr-team">${d.team.flag} ${d.team.name}</span>
      <span class="dr-arrow">&#x2192;</span>
      <span class="dr-player">&#x1F3AE; ${d.player}</span>
    </div>
  `).join('');
  el.scrollTop = el.scrollHeight;
}

function downloadDraft() {
  if (draftHistory.length === 0) return;
  const header = 'Pick,Team,Confederation,Player\n';
  const rows = draftHistory.map((d, i) =>
    `${i + 1},"${d.team.name}","${d.team.conf}","${d.player}"`
  ).join('\n');
  const csv = header + rows;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'world-cup-2026-draft-results.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function resetAll() {
  if (spinning) return;
  eliminatedTeams.clear();
  eliminatedPlayers.clear();
  draftHistory = [];
  teamAngle = 0; playerAngle = 0;
  document.getElementById('pairingResult').innerHTML = '';
  document.getElementById('downloadBtn').disabled = true;
  drawTeamWheel();
  drawPlayerWheel();
  renderPlayerList();
  updateUI();
  updateDraftSidebar();
}

// --- CONFETTI ---
const confettiCanvas = document.getElementById('confetti');
const cCtx = confettiCanvas.getContext('2d');
let confettiParticles = [], confettiAnim = null;

function launchConfetti() {
  confettiCanvas.width = window.innerWidth * DPR;
  confettiCanvas.height = window.innerHeight * DPR;
  confettiCanvas.style.width = window.innerWidth + 'px';
  confettiCanvas.style.height = window.innerHeight + 'px';
  const colors = ['#D4AF37','#E4002B','#003DA5','#fff','#1B6B3A','#f5e6a3','#8B5CF6'];
  confettiParticles = [];
  for (let i = 0; i < 125; i++) {
    confettiParticles.push({
      x: Math.random() * confettiCanvas.width, y: -20 * DPR,
      w: (Math.random() * 8 + 4) * DPR, h: (Math.random() * 4 + 2) * DPR,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: (Math.random() * 3 + 2) * DPR, vx: (Math.random() - 0.5) * 3 * DPR,
      rot: Math.random() * Math.PI * 2, rotV: (Math.random() - 0.5) * 0.2, life: 1,
    });
  }
  if (confettiAnim) cancelAnimationFrame(confettiAnim);
  animateConfetti();
}

function animateConfetti() {
  cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  let alive = false;
  confettiParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08 * DPR;
    p.rot += p.rotV; p.life -= 0.006;
    if (p.life <= 0 || p.y > confettiCanvas.height) return;
    alive = true;
    cCtx.save();
    cCtx.translate(p.x, p.y); cCtx.rotate(p.rot);
    cCtx.globalAlpha = p.life; cCtx.fillStyle = p.color;
    cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cCtx.restore();
  });
  if (alive) confettiAnim = requestAnimationFrame(animateConfetti);
  else cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
}

window.addEventListener('resize', resizeCanvases);
resizeCanvases();
updateUI();
</script>
